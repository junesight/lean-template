    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --border: #e5e7eb;
      --success: #16a34a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .app {
      width: min(100% - 32px, 1480px);
      max-width: 1480px;
      margin: 0 auto;
      padding: 24px 0 48px;
    }

    .header {
      max-width: 760px;
      margin: 0 auto 20px;
      text-align: center;
    }

    .eyebrow {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    h1 {
      max-width: 640px;
      font-size: clamp(28px, 3vw, 40px);
      line-height: 1.25;
      margin: 0 auto 8px;
      letter-spacing: -0.03em;
    }

    .description {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      margin: 20px 0 14px;
      justify-content: center;
    }

    .search {
      width: 100%;
      max-width: 640px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 15px;
      outline: none;
      background: #fff;
      text-align: center;
    }

    .search:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .category-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      max-width: 760px;
      margin: 0 auto 12px;
    }

    .category-button {
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      background: #fff;
      color: var(--muted);
      transition: 0.15s ease;
    }

    .category-button:hover {
      background: #f3f4f6;
    }

    .category-button.active {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.04);
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    #templateList {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 14px;
      align-items: stretch;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      padding: 4px 9px;
      border-radius: 999px;
      background: #eff6ff;
      color: #1d4ed8;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .tag.naver-blog {
      background: #dcfce7;
      color: #15803d;
    }

    .tag.youtube {
      background: #fee2e2;
      color: #b91c1c;
    }

    .card-title {
      font-size: 19px;
      font-weight: 800;
      line-height: 1.35;
      margin: 0 0 10px;
      letter-spacing: -0.02em;
      min-height: 2.7em;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .preview {
      white-space: pre-wrap;
      word-break: break-word;
      background: #f9fafb;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      font-size: 15px;
      line-height: 1.6;
      color: #374151;
      margin: 0 0 14px;
      flex: 1;
    }

    .actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      background: var(--primary);
      color: #fff;
      transition: 0.15s ease;
    }

    button:hover {
      background: var(--primary-hover);
    }

    .secondary {
      background: #eef2ff;
      color: #3730a3;
    }

    .secondary:hover {
      background: #e0e7ff;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%) translateY(16px);
      background: #111827;
      color: #fff;
      padding: 12px 16px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: 0.2s ease;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.18);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .empty {
      display: none;
      color: var(--muted);
      text-align: center;
      padding: 36px 0;
      font-size: 15px;
    }

        grid-template-columns: repeat(2, minmax(0, 1fr));
        max-width: 420px;
      }

      .category-button {

      }
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 23px;
      }

      .actions {
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }

    const templateList = document.getElementById("templateList");
    const searchInput = document.getElementById("searchInput");
    const categoryFilters = document.getElementById("categoryFilters");
    const emptyState = document.getElementById("emptyState");
    const toast = document.getElementById("toast");
    let activeCategory = "전체";

    function renderCategoryFilters() {
      const categories = ["전체", ...new Set(templates.map((template) => template.category))];

      categoryFilters.innerHTML = categories
        .map((category) => {
          const activeClassName = category === activeCategory ? " active" : "";

          return `<button type="button" class="category-button${activeClassName}" data-category="${escapeHtml(category)}">${escapeHtml(category)}</button>`;
        })
        .join("");
    }

    function renderTemplates(keyword = "") {
      const normalizedKeyword = keyword.trim().toLowerCase();
      const categoryOrder = ["안내 링크", "유튜브 링크", "네이버 블로그 링크"];

      const filteredTemplates = templates
        .filter((template) => {
          const searchableText = [
            template.category,
            template.title,
            template.content
          ].join(" ").toLowerCase();

          const matchesCategory = activeCategory === "전체" || template.category === activeCategory;

          return matchesCategory && searchableText.includes(normalizedKeyword);
        })
        .sort((a, b) => {
          const categoryDifference = categoryOrder.indexOf(a.category) - categoryOrder.indexOf(b.category);
          if (categoryDifference !== 0) return categoryDifference;

          const favoriteDifference = Number(Boolean(b.favorite)) - Number(Boolean(a.favorite));
          if (favoriteDifference !== 0) return favoriteDifference;

          return (b.addedAt || "").localeCompare(a.addedAt || "");
        });

      templateList.innerHTML = "";

      filteredTemplates.forEach((template) => {
        const card = document.createElement("article");
        card.className = "card";
        const tagClassName = template.category === "네이버 블로그 링크"
          ? "tag naver-blog"
          : template.category === "유튜브 링크"
            ? "tag youtube"
            : "tag";
        card.innerHTML = `
          <div class="${tagClassName}">${template.category}</div>
          <h2 class="card-title">${template.favorite ? "⭐ " : ""}${escapeHtml(template.title).replaceAll("\n", "<br>")}</h2>
          <pre class="preview">${escapeHtml(template.content)}</pre>
          <div class="actions">
            <button type="button" data-copy-id="${template.id}">복사</button>
            <button type="button" class="secondary" data-open-url="${template.url}">링크 열기</button>
          </div>
        `;

        templateList.appendChild(card);
      });

      emptyState.style.display = filteredTemplates.length ? "none" : "block";
    }

    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
        showToast("복사 완료");
      } catch (error) {
        fallbackCopyText(text);
      }
    }

    function fallbackCopyText(text) {
      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.setAttribute("readonly", "");
      textarea.style.position = "fixed";
      textarea.style.left = "-9999px";
      document.body.appendChild(textarea);
      textarea.select();

      try {
        document.execCommand("copy");
        showToast("복사 완료");
      } catch (error) {
        showToast("복사 실패. 텍스트를 직접 선택해 주세요.");
      }

      document.body.removeChild(textarea);
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");

      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => {
        toast.classList.remove("show");
      }, 1600);
    }

    function escapeHtml(text) {
      return text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    templateList.addEventListener("click", (event) => {
      const copyButton = event.target.closest("[data-copy-id]");
      const openButton = event.target.closest("[data-open-url]");

      if (copyButton) {
        const template = templates.find((item) => item.id === copyButton.dataset.copyId);
        if (template) copyText(template.content);
      }

      if (openButton) {
        window.open(openButton.dataset.openUrl, "_blank", "noopener,noreferrer");
      }
    });

    categoryFilters.addEventListener("click", (event) => {
      const categoryButton = event.target.closest("[data-category]");

      if (!categoryButton) return;

      activeCategory = categoryButton.dataset.category;
      renderCategoryFilters();
      renderTemplates(searchInput.value);
    });

    searchInput.addEventListener("input", (event) => {
      renderTemplates(event.target.value);
    });

    renderCategoryFilters();
    renderTemplates();
  </script>
</body>
</html>
